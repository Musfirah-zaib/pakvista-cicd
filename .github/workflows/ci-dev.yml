name: CI – Development

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint HTML & CSS
        run: |
          npx --yes htmlhint "*.html" || true
          npx --yes stylelint "style.css" --allow-empty-input || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/pakvista:dev-latest
            ${{ vars.DOCKERHUB_USERNAME }}/pakvista:dev-${{ github.sha }}